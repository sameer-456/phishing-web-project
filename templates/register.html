<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white flex items-center justify-center h-screen">

<div class="bg-slate-900 p-10 rounded-2xl shadow-2xl w-[400px] text-center">

<h2 class="text-2xl font-bold mb-6 text-cyan-400">
🚀 Create Account
</h2>

<form method="POST" class="space-y-4">

<input
type="email"
name="email"
placeholder="Enter Email"
required
class="w-full p-3 rounded bg-slate-800 border border-slate-700 text-white"
/>

<input
type="password"
name="password"
placeholder="Enter Password"
required
class="w-full p-3 rounded bg-slate-800 border border-slate-700 text-white"
/>

<button
type="submit"
class="w-full bg-cyan-500 hover:bg-cyan-600 p-3 rounded font-bold transition"
>
Register
</button>

</form>

<a href="/" class="block mt-4 text-cyan-400 hover:underline">
← Back to Login
</a>

</div>

</body>
</html>
