<!DOCTYPE html>
<html>
<head>

<title>Phishing Detection</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>

function showLoading(){
document.getElementById("loading").style.display="block";
}

</script>

</head>

<body class="bg-slate-950 text-white flex items-center justify-center h-screen">

<div class="bg-slate-900 p-10 rounded-xl shadow-xl w-[450px] text-center">

<h2 class="text-2xl font-bold mb-6">
🔍 URL Phishing Detector
</h2>

<form method="POST" onsubmit="showLoading()" class="space-y-4">

<input
type="text"
name="url"
placeholder="Enter URL"
required
class="w-full p-3 rounded bg-slate-800 border border-slate-700"
/>

<button
type="submit"
class="w-full bg-cyan-500 hover:bg-cyan-600 p-3 rounded font-bold"
>
Check URL
</button>

</form>

<!-- Loading animation -->

<div id="loading" style="display:none;" class="mt-6">

<p class="text-yellow-400 animate-pulse">
Scanning URL...
</p>

<div class="w-full bg-slate-700 h-3 rounded mt-2">
<div class="bg-cyan-500 h-3 rounded animate-pulse w-full"></div>
</div>

</div>

{% if result %}

<div class="mt-6 text-lg font-bold">

{% if result == "PHISHING" %}
<div style="color:red;font-size:20px;">
⚠️ Phishing Website
</div>
{% elif result == "SAFE" %}
<div style="color:lightgreen;font-size:20px;">
✅ Safe Website
</div>
{% endif %}

</div>

<!-- Confidence score -->

<div class="mt-3 text-sm text-gray-300">

AI Confidence Score :

<span class="text-cyan-400 font-bold">

{{ confidence }}%

</span>

</div>

{% endif %}

<a href="/dashboard" class="block mt-6 text-cyan-400 hover:underline">
← Back to Dashboard
</a>

</div>

</body>
</html>
